                <button id="signUp_button">

        </header>

        <main class="mt-9 mx-7">
            <section class="mb-8">
                <img src="images/hero-section.png" alt=" livre scolaire">
            </section>
            <h1 class="text-3xl font-bold text-center">Courses</h1>

            <select name="Courses" id="course_select">
                <option value="" disabled selected> Select course </option>
                <option value="Tout">Tout</option>
                <option value="Français">Français</option>
                <option value="Anglais">Anglais</option>
                <option value="Arabe">Arabe</option>
                <option value="Mathématiques">Mathématiques</option>
                <option value="Physique">Physique</option>
                <option value="Chimie">Chimie</option>
                <option value="Informatique">Informatique</option>
                <option value="JavaScript">JavaScript</option>
                <option value="HTML et CSS">HTML et CSS</option>
                <option value="Comptabilité">Comptabilité</option>
                <option value="Économie">Économie</option>
                <option value="Sciences naturelles">Sciences naturelles</option>
                <option value="Histoire">Histoire</option>
                <option value="Géographie">Géographie</option>
                <option value="Préparation au Bac">Préparation au Bac</option>
            </select>

            <div id="courses_container" class="mt-10 grid grid-cols-5 gap-7">
            </div>
        </main>
    </div>

    <div id="popup" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">

        <div class="w-full max-w-lg rounded-2xl bg-white p-5 shadow-2xl">

            <div class="mb-5 flex items-center justify-between border-b pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-[#123933]">
                        Mon panier
                    </h2>
                    <p class="mt-1 text-sm text-gray-500">
                        Les cours que vous avez sélectionnés
                    </p>
                </div>

                <button id="exit_popup"
                    class="cursor-pointer rounded-full px-3 py-1 text-2xl text-gray-500 transition hover:bg-gray-100 hover:text-red-500"
                    aria-label="Fermer le panier">
                    &times;
                </button>
            </div>

            <div class="max-h-80 space-y-3 overflow-y-auto">

                <!-- Cours 1 -->

                    <img src="images/francais.png" alt="Cours de français" class="h-20 w-20 rounded-lg object-cover">

                    <div class="flex flex-1 flex-col justify-between">

                            <h3 class="text-lg font-semibold text-gray-800">

                            </h3>
                            <p class="text-xs text-gray-500">
                                Soir de 17h00 à 19h00

                        <p class="mt-2 font-semibold text-[#123933]">
                            280 MAD / mois
                        </p>

                        Supprimer
                    </button>

            </div>

            <div class="mt-5 border-t pt-4">
                <div class="flex items-center justify-between">
                    <span class="text-gray-600">Total mensuel</span>
                    <span class="text-xl font-bold text-[#123933]">

                    </span>
                </div>

                <button id="continue_shopping"
                    class="mt-2 w-full rounded-lg border border-gray-300 px-4 py-2 text-gray-700 transition hover:bg-gray-100">
                    Continuer mes achats
                </button>
            </div>

        </div>
    </div>


    <div id="signUp_popup" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">

        <div class="w-200 max-w-[95%] rounded-2xl bg-white p-6 shadow-2xl">

            <!-- Header -->
            <div class="mb-6 flex items-center justify-between border-b border-gray-200 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-[#123933]">
                        Sign Up
                    </h2>
                    <p class="mt-1 text-sm text-gray-500">
                        Create your account
                    </p>
                </div>

                <button id="exit_SignUp_popup" type="button"
                    class="cursor-pointer text-2xl text-gray-500 hover:text-red-500">
                    &times;
                </button>
            </div>

            <!-- Form -->
            <form class="space-y-4">

                <div>
                    <label for="signup_phone" class="mb-1 block text-sm font-medium text-gray-700">
                        Phone Number
                    </label>
                    <input id="signup_phone" type="tel" placeholder="Enter your phone number"
                        class="box-border w-full rounded-lg border border-gray-300 px-3 py-3 outline-none focus:border-[#123933]">
                    <p id="tel_message" class="mt-1 text-sm text-red-500 hidden">Numero invalide</p>
                </div>

                <div>
                    <label for="signup_email" class="mb-1 block text-sm font-medium text-gray-700">
                        Email Address
                    </label>
                    <input id="signup_email" type="email" placeholder="example@email.com"
                        class="box-border w-full rounded-lg border border-gray-300 px-3 py-3 outline-none focus:border-[#123933]">
                    <p id="email_message" class="mt-1 text-sm text-red-500 hidden">
                        Email invalide
                    </p>
                </div>

                <div>
                    <label for="signup_password" class="mb-1 block text-sm font-medium text-gray-700">
                        Password
                    </label>
                    <input id="signup_password" type="password" placeholder="Enter your password"
                        class="box-border w-full rounded-lg border border-gray-300 px-3 py-3 outline-none focus:border-[#123933]">
                    <p id="password_message" class="mt-1 text-sm text-red-500 hidden">
                        password invalide
                    </p>
                </div>

                <button type="button" id="create_accounte_button"
                    class="w-full rounded-lg bg-[#123933] py-3 font-semibold text-white transition hover:bg-[#1b5148]">
                    Create Account
                </button>

                <p class="text-center text-sm text-gray-500">
                    Already have an account?
                    <a href="#" class="font-semibold text-[#123933] hover:underline">
                        Log In
                    </a>
                </p>

            </form>
        </div>
    </div>
